<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{% block title %}{{ settings.site_title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ og_description }}{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ settings.site_title }}">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:locale" content="fr_FR">
{% if og_url %}<meta property="og:url" content="{{ og_url }}">{% endif %}
{% if og_image %}<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ og_image }}">{% endif %}
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ og_description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_url('css/style.css') }}">
<script>
  // Applique le thème mémorisé avant le premier rendu pour éviter un flash.
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body data-page="{{ page }}"{% if preset %} data-preset="{{ preset }}"{% endif %}{% if site_url %} data-site-url="{{ site_url }}"{% endif %}>
<div class="wrap">
  <header class="top">
    <nav aria-label="Navigation principale">
      <a href="{{ page_url('index') }}" {% if page == 'index' %}aria-current="page"{% endif %}>Simulateur</a>
      <a href="{{ page_url('methode') }}" {% if page == 'methode' %}aria-current="page"{% endif %}>Méthode</a>
    </nav>
    <button type="button" class="theme" id="themeToggle" aria-label="Basculer le thème clair ou sombre" title="Thème clair / sombre">
      <span aria-hidden="true">◐</span>
    </button>
  </header>
  {% block content %}{% endblock %}
  <footer class="foot">
    <a href="{{ page_url('methode') }}">Méthode</a> · <a href="{{ page_url('mentions') }}">Mentions légales</a>
  </footer>
</div>
{% if goatcounter_code %}
<script data-goatcounter="https://{{ goatcounter_code }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{% endif %}
<script src="{{ static_url('js/theme.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
